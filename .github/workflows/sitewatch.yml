name: sitewatch

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: fast or nightly
        required: true
        default: fast
        type: choice
        options:
          - fast
          - nightly

permissions:
  contents: write

concurrency:
  group: sitewatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Choose mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "gate=0" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 1 * * *" ]; then
            echo "mode=nightly" >> "$GITHUB_OUTPUT"
            echo "gate=0" >> "$GITHUB_OUTPUT"
          else
            echo "mode=fast" >> "$GITHUB_OUTPUT"
            echo "gate=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Playwright for nightly geometry
        if: steps.mode.outputs.mode == 'nightly'
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run
        id: watch
        continue-on-error: true
        run: |
          set -o pipefail
          if [ "${{ steps.mode.outputs.gate }}" = "1" ]; then
            python -m pcone_sitewatch fast --publish-gate | tee /tmp/sitewatch-out.txt
          else
            python -m pcone_sitewatch ${{ steps.mode.outputs.mode }} | tee /tmp/sitewatch-out.txt
          fi
          if grep -q '^SITEWATCH_NOCOMMIT' /tmp/sitewatch-out.txt; then
            echo "commit=0" >> "$GITHUB_OUTPUT"
          else
            echo "commit=1" >> "$GITHUB_OUTPUT"
            echo "subject<<EOF" >> "$GITHUB_OUTPUT"
            sed -n 's/^SITEWATCH_SUBJECT //p' /tmp/sitewatch-out.txt | head -1 >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi
      - name: Record a failed run without touching findings
        if: steps.watch.outcome == 'failure'
        run: |
          python - << 'PY'
          from pathlib import Path
          Path("sitewatch").mkdir(exist_ok=True)
          Path("sitewatch/ALERT.md").write_text("прогон не прошёл: workflow failed\n", encoding="utf-8")
          Path("sitewatch/SUMMARY.txt").write_text("Сторож: прогон не прошёл — workflow failed\n", encoding="utf-8")
          PY
      - name: Commit
        if: steps.watch.outputs.commit == '1' || steps.watch.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p sitewatch/history
          git add -- sitewatch/findings.jsonl sitewatch/state.json sitewatch/meta.json sitewatch/report.html sitewatch/SUMMARY.txt sitewatch/history || true
          if [ -f sitewatch/ALERT.md ]; then git add sitewatch/ALERT.md; else git rm -f --ignore-unmatch sitewatch/ALERT.md; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "${{ steps.watch.outputs.subject || 'sitewatch: прогон не прошёл' }}"
          git pull --rebase origin main
          git push
